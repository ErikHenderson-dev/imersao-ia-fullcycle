[project]
name = "agents"
version = "0.1.0"
description = "Serviço de agentes do Full Cycle Chat"
dependencies = [
    "google-adk>=2.12.0,<3.0.0",
    "fastapi",
    "uvicorn",
    "python-dotenv",
    # Sessões do ADK no Banco dos agentes (SESSION_SERVICE_URI postgresql+asyncpg://).
    "asyncpg",
    "sqlalchemy[asyncio]",
]
requires-python = ">=3.13,<3.14"


[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "httpx",
    "google-agents-cli~=1.13.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.12.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=2.2.0,<3.0.0"
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006"] # ignore line too long, too complex

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
# Ignore common issues with third-party libraries and dynamic code patterns
import-not-found = "ignore"
missing-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge"
skip = "uv.lock,.venv"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["app"]


