name: fullcycle-slack-ia

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    # Init como PID 1: o sh do CMD ignora SIGTERM, e sem isso todo stop termina em kill (137).
    init: true
    volumes:
      # Repositório inteiro: o file:../../packages/chat-events precisa resolver igual dentro e fora.
      - .:/home/node/app
    environment:
      CHAT_API_URL: http://chat-api:3000
      # Endereço em que o navegador abre o WebSocket da API do chat.
      CHAT_API_PUBLIC_URL: http://localhost:3001
      # Serviço de agentes pela rede interna, com a credencial de serviço de desenvolvimento.
      AGENTS_SERVICE_URL: http://agents:8000
      AGENTS_SERVICE_TOKEN: dev-agents-service-token
      SESSION_COOKIE_NAME: fc_session
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    depends_on:
      - chat-api

  # Testes de ponta a ponta do web e playwright-cli. Sobe só com --profile e2e e fica parado.
  e2e:
    # Mesma versão exata do @playwright/test do apps/web/package.json.
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    profiles: [e2e]
    init: true
    user: "1000:1000"
    working_dir: /home/node/app/apps/web
    volumes:
      - .:/home/node/app
    environment:
      # O navegador do teste abre a web e a API por localhost, como o da máquina, pelo
      # encaminhador de portas (LLD, "Ambiente de desenvolvimento").
      BASE_URL: http://localhost:3000
      # As fixtures gravam as Pessoas de teste direto no banco chat (LLD, "Ambiente de desenvolvimento").
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat
      # Estado de conexão dos Agentes, gravado pelos testes da F10 (support/agents.ts).
      AGENTS_DATABASE_URL: postgres://agents:agents@postgres:5432/agents
      # A fixture da recuperação apaga a época dos eventos no Redis de desenvolvimento.
      REDIS_URL: redis://redis:6379/0
      # O apoio de bot dos testes da F11 age pelas rotas /v1/bot (support/bot.ts).
      CHAT_BOT_TOKEN: dev-chat-bot-token
      PLAYWRIGHT_HTML_OPEN: never
      HOME: /tmp
    command: ["node", "e2e/support/port-forward.mjs"]
    depends_on:
      - web
      - chat-api

  chat-api:
    build:
      context: ./apps/chat-api
      dockerfile: Dockerfile.dev
    init: true
    volumes:
      - .:/home/node/app
    environment:
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat
      TEST_DATABASE_URL: postgres://chat:chat@postgres:5432/chat_test
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@postgres:5432/postgres
      SESSION_COOKIE_NAME: fc_session
      SESSION_TTL_DAYS: "30"
      # Origem da web aceita no handshake do WebSocket.
      WEB_ORIGIN: http://localhost:3000
      # Eventos por Pessoa para a reconexão; os testes usam o banco lógico 1.
      REDIS_URL: redis://redis:6379/0
      TEST_REDIS_URL: redis://redis:6379/1
      # Credencial de bot das rotas /v1/bot; segredo fixo, só de desenvolvimento, igual ao do agents.
      CHAT_BOT_TOKEN: dev-chat-bot-token
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
      # A API sobe mesmo com o Redis fora: a reconexão só passa a recarregar.
      redis:
        condition: service_started

  # Serviço de agentes (Python + Google ADK). Fica parado, como web e chat-api.
  agents:
    build:
      context: ./apps/agents
      dockerfile: Dockerfile.dev
    init: true
    volumes:
      - .:/home/app/repo
    # GEMINI_API_KEY, fora do git. Sem o arquivo, o contêiner sobe e o agente não chama o modelo.
    env_file:
      - path: ./apps/agents/.env
        required: false
    environment:
      # Sessões do ADK no Banco dos agentes.
      SESSION_SERVICE_URI: postgresql+asyncpg://agents:agents@postgres:5432/agents
      # Registro de Agentes e Alembic, no mesmo banco (spec da F10, "Registro de Agentes").
      DATABASE_URL: postgresql+asyncpg://agents:agents@postgres:5432/agents
      # Credencial de serviço do BFF; segredo fixo, só de desenvolvimento, igual ao da web.
      AGENTS_SERVICE_TOKEN: dev-agents-service-token
      # O Agente age na Conversa como bot, pelas rotas /v1/bot da API do chat (ADR 0010), com a
      # credencial de bot; segredo fixo, só de desenvolvimento, igual ao do chat-api.
      CHAT_API_URL: http://chat-api:3000
      CHAT_BOT_TOKEN: dev-chat-bot-token
      # Limite de pedidos por Pessoa (spec da F11, "Rota de Pedido"); os testes de integração usam o
      # banco lógico 2, e o 1 é dos testes da API do chat.
      REDIS_URL: redis://redis:6379/0
      TEST_REDIS_URL: redis://redis:6379/2
      # Rotas genéricas e interface web do ADK, só no desenvolvimento.
      ADK_DEV_ROUTES: "true"
      # Banco dos testes de integração, recriado a cada execução pelo superusuário local.
      TEST_DATABASE_URL: postgresql+asyncpg://agents:agents@postgres:5432/agents_test
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@postgres:5432/postgres
      # Banco de negócio (spec da F13, "Ambiente de desenvolvimento"): a consulta usa o usuário só
      # leitura (ADR 0013); só o script de carga usa o dono; os testes de integração, o business_test,
      # criado pelo próprio teste como o agents_test.
      BUSINESS_DATABASE_URL: postgresql+asyncpg://business_readonly:business_readonly@postgres:5432/business
      BUSINESS_OWNER_DATABASE_URL: postgresql+asyncpg://business:business@postgres:5432/business
      BUSINESS_TEST_DATABASE_URL: postgresql+asyncpg://business_readonly:business_readonly@postgres:5432/business_test
      # Modelo dos Agentes (spec da F11, "Modelo de IA"). Este environment vence o env_file: para
      # trocar, AGENT_MODEL=openai/<modelo> docker compose -f compose.yaml up -d agents.
      AGENT_MODEL: ${AGENT_MODEL:-gemini-3.6-flash}
      # Gemini pelo Google AI Studio (GEMINI_API_KEY), sem projeto do Google Cloud.
      GOOGLE_GENAI_USE_ENTERPRISE: "false"
      AGENTS_CLI_TELEMETRY: "0"
    ports:
      - "3002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      # Sem o Redis, o Serviço de agentes sobe e recusa os Pedidos com agents_unavailable.
      redis:
        condition: service_started

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Eventos por Pessoa para a reconexão do WebSocket (HLD 6.2).
  redis:
    image: redis:8
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Substituto local do armazenamento compatível com S3.
  s3:
    image: chrislusf/seaweedfs:4.52
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: fullcycle
      AWS_SECRET_ACCESS_KEY: fullcycle-secret
      S3_BUCKET: reports
    volumes:
      - s3-data:/data
    ports:
      - "8333:8333"

volumes:
  postgres-data:
  s3-data:
  redis-data:
